apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: alertmanager-telegram-config
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: alertmanager-telegram-config
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        alertmanager.yaml: |
          global:
            resolve_timeout: 5m
          route:
            group_by: ['namespace', 'alertname']
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 4h
            receiver: 'telegram'
            routes:
              - matchers:
                  - alertname = "Watchdog"
                receiver: 'null'
          receivers:
            - name: 'null'
            - name: 'telegram'
              telegram_configs:
                - bot_token: '{{ .bot_token }}'
                  chat_id: {{ .chat_id }}
                  send_resolved: true
                  parse_mode: 'HTML'
  data:
    - secretKey: bot_token
      remoteRef:
        key: secret/monitoring/telegram
        property: bot_token
    - secretKey: chat_id
      remoteRef:
        key: secret/monitoring/telegram
        property: chat_id
