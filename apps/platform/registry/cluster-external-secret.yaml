apiVersion: external-secrets.io/v1beta1
kind: ClusterExternalSecret
metadata:
  name: registry-ghcr
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  externalSecretName: registry-ghcr
  namespaceSelectors:
    - matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - kube-public
            - kube-node-lease
  refreshTime: 1m
  externalSecretSpec:
    secretStoreRef:
      name: vault-backend
      kind: ClusterSecretStore
    refreshInterval: 1h
    target:
      name: registry-ghcr
      creationPolicy: Owner
      deletionPolicy: Retain
      template:
        type: kubernetes.io/dockerconfigjson
        engineVersion: v2
        data:
          .dockerconfigjson: |
            {
              "auths": {
                "ghcr.io": {
                  "username": "{{ .username }}",
                  "password": "{{ .token }}",
                  "auth": "{{ printf "%s:%s" .username .token | b64enc }}"
                }
              }
            }
    data:
      - secretKey: username
        remoteRef:
          key: secret/platform/registry
          property: username
      - secretKey: token
        remoteRef:
          key: secret/platform/registry
          property: token
