apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-template-secret
  labels:
    app.kubernetes.io/name: app-template
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: app-template-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgresql://{{ .db_user }}:{{ .db_password | urlquery }}@{{ .db_host }}:{{ .db_port }}/{{ .db_name }}"
        DB_HOST: "{{ .db_host }}"
        DB_PORT: "{{ .db_port }}"
        DB_USER: "{{ .db_user }}"
        DB_PASSWORD: "{{ .db_password }}"
        DB_NAME: "{{ .db_name }}"
  data:
    - secretKey: db_host
      remoteRef:
        key: secret/app-template/database
        property: host
    - secretKey: db_port
      remoteRef:
        key: secret/app-template/database
        property: port
    - secretKey: db_user
      remoteRef:
        key: secret/app-template/database
        property: user
    - secretKey: db_password
      remoteRef:
        key: secret/app-template/database
        property: password
    - secretKey: db_name
      remoteRef:
        key: secret/app-template/database
        property: name
