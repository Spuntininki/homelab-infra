apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - external-secret.yaml

configMapGenerator:
  - name: app-template-dashboard
    files:
      - dashboards/overview.json
    options:
      labels:
        grafana_dashboard: "1"
