apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-template
  labels:
    app.kubernetes.io/name: app-template
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: app-template
  template:
    metadata:
      labels:
        app.kubernetes.io/name: app-template
    spec:
      enableServiceLinks: false
      imagePullSecrets:
        - name: registry-ghcr
      containers:
        - name: app
          image: ghcr.io/spuntininki/app-template:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - secretRef:
                name: app-template-secret
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
